<!DOCTYPE html>
<html lang="sv"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fördelning av nämndplatser</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f5f6f8;--card:#fff;--tx:#1d2330;--mut:#667085;--ln:#dfe3ea;--lock:#eef0f4;--gain:#d8f2df;--gaintx:#146c2e;--loss:#fbdcdc;--losstx:#a11f1f;--ok:#146c2e;--bad:#a11f1f;--acc:#2f5fd0}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171d;--card:#1d222b;--tx:#e9ecf2;--mut:#98a2b3;--ln:#323947;--lock:#262c37;--gain:#1b4a2a;--gaintx:#8be0a4;--loss:#552425;--losstx:#ffaaa8;--ok:#8be0a4;--bad:#ffaaa8;--acc:#7da2ff}}
:root[data-theme="dark"]{--bg:#14171d;--card:#1d222b;--tx:#e9ecf2;--mut:#98a2b3;--ln:#323947;--lock:#262c37;--gain:#1b4a2a;--gaintx:#8be0a4;--loss:#552425;--losstx:#ffaaa8;--ok:#8be0a4;--bad:#ffaaa8;--acc:#7da2ff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:1100px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:16px;margin:0}
.sub{color:var(--mut);margin:0 0 12px}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:13px;margin:10px 0 16px;color:var(--mut)}
.legend span b{display:inline-block;padding:1px 8px;border-radius:6px;margin-right:4px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:14px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(460px,1fr));gap:14px}
@media(max-width:560px){.grid{grid-template-columns:1fr}}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.size{color:var(--mut);font-weight:400;font-size:13px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:5px 6px;text-align:center;border-bottom:1px solid var(--ln)}
th{font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--mut);font-weight:600}
td:first-child,th:first-child{text-align:left}
.lockc{background:var(--lock)}
.pt{display:inline-block;min-width:34px;text-align:center;padding:1px 8px;border-radius:6px;font-weight:700;color:#fff}
.MP{background:#4f9a3c}.C{background:#0b7a45}.V{background:#c0392b}.KD{background:#2a5db0}
.step{display:inline-flex;align-items:center;gap:4px;padding:2px 4px;border-radius:8px}
.step button{width:24px;height:24px;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:6px;cursor:pointer;font-size:15px;line-height:1}
.step button:hover{border-color:var(--acc)}.step output{min-width:16px;font-weight:700}
.step.gain{background:var(--gain);color:var(--gaintx)}.step.loss{background:var(--loss);color:var(--losstx)}
.chg{font-size:12px;text-align:left}
.chip{display:inline-block;padding:1px 7px;border-radius:10px;margin:1px 2px 1px 0;font-weight:600;white-space:nowrap}
.chip.g{background:var(--gain);color:var(--gaintx)}.chip.l{background:var(--loss);color:var(--losstx)}
tfoot td{font-size:12px;font-weight:600;border-bottom:0}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.posts{margin-top:10px;padding-top:8px;border-top:1px dashed var(--ln)}
.post{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:4px 0;font-size:14px}
.post .nm{flex:1 1 170px}
select,input[type=number]{font:inherit;padding:3px 6px;border:1px solid var(--ln);border-radius:6px;background:var(--card);color:var(--tx)}
input[type=number]{width:64px}
.btn{font:inherit;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:8px;padding:5px 10px;cursor:pointer}
.btn:hover{border-color:var(--acc)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.sum td,.sum th{padding:6px}
.badge{font-size:12px;font-weight:700;padding:2px 8px;border-radius:10px;background:var(--lock);color:var(--mut)}
.badge.ok{background:var(--gain);color:var(--gaintx)}.badge.bad{background:var(--loss);color:var(--losstx)}
</style></head><body><main>
<div class="top"><div><h1>Fördelning av nämndplatser</h1>
<p class="sub">Vänster sida är d’Hondt (låst). Höger sida är förhandlingsbar: flytta platser med − och +.</p></div>
<button class="btn" id="reset">Återställ allt</button></div>
<div class="legend"><span><b style="background:var(--lock)">Grå</b>låst enligt d’Hondt</span><span><b style="background:var(--loss);color:var(--losstx)">Röd</b>partiet avstår plats</span><span><b style="background:var(--gain);color:var(--gaintx)">Grön</b>partiet tar plats</span><span><b style="background:var(--lock)">✓ / !</b>antal platser stämmer / stämmer inte</span></div>
<div id="summary"></div>
<div id="fm"></div>
<div class="grid" id="bodies"></div>
<div id="rev"></div>
</main>
<script>
const P=['MP','C','V','KD'];
const el=()=>S&&S.two===false?P:['MP','C'];
const FM={MP:[5,3],C:[4,2],V:[3,2],KD:[1,0]};
const z=[0,0];
const B=[
{id:'ks',n:'Kommunstyrelsen',l:5,e:5,f:{MP:[2,2],C:[2,2],V:[1,1],KD:z},v:{MP:[2,2],C:[2,1],V:[1,1],KD:[0,1]},posts:[['Andre vice ordförande',80,'MP'],['Oppositionsföreträdare',20,'C']]},
{id:'sam',n:'Samhällsnämnd',l:3,e:2,f:{MP:[1,1],C:[1,1],V:[1,0],KD:z},v:{MP:[1,1],C:[1,0],V:[1,0],KD:[0,1]},posts:[['Andre vice ordförande',80,'MP']]},
{id:'sko',n:'Skolnämnd',l:3,e:2,f:{MP:[1,1],C:[1,1],V:[1,0],KD:z},v:{MP:[1,0],C:[1,1],V:[1,0],KD:[0,1]},posts:[['Andre vice ordförande',80,'C']]},
{id:'soc',n:'Socialnämnd',l:3,e:2,f:{MP:[1,1],C:[1,1],V:[1,0],KD:z},v:{MP:[1,0],C:[1,1],V:[1,0],KD:[0,1]},posts:[['Andre vice ordförande',80,'C']]},
{id:'hem',n:'Hemab',l:2,e:1,f:{MP:[1,1],C:[1,0],V:z,KD:z},v:{MP:[1,1],C:[1,0],V:z,KD:z},posts:[['Andre vice ordförande',80,'MP']]},
{id:'hhu',n:'Härnösandshus',l:2,e:1,f:{MP:[1,1],C:[1,0],V:z,KD:z},v:{MP:[1,1],C:[1,0],V:z,KD:z},posts:[['Andre vice ordförande',80,'MP']]},
{id:'tec',n:'Technichus',l:1,e:1,f:{MP:[1,1],C:z,V:z,KD:z},v:{MP:[0,1],C:[1,0],V:z,KD:z},posts:[['Andre vice ordförande',80,'C']]},
{id:'val',n:'Valnämnd',l:1,e:1,f:{MP:[1,1],C:z,V:z,KD:z},v:{MP:[1,1],C:z,V:z,KD:z},posts:[]}];
const FMP=[['Andre vice ordförande',10,'C']];
const PCT={sam:15,sko:15,soc:20,hem:10,hhu:5,tec:5};
const REV=[['Ordförande',25,'C'],['1e vice ordförande',10,'MP']];
const KEY='nf-v2';
let S;
function init(){S={seats:{},posts:{}};B.forEach(b=>{S.seats[b.id]=JSON.parse(JSON.stringify(b.v));S.posts[b.id]=b.posts.map(p=>[PCT[b.id]??p[1],p[2]])});
S.posts.fm=FMP.map(p=>[p[1],p[2]]);S.posts.rev=REV.map(p=>[p[1],p[2]])}
function load(){init();try{const s=localStorage.getItem(KEY);if(s)S=JSON.parse(s)}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const pt=p=>`<span class="pt ${p}">${p}</span>`;
const sum=(o,i)=>P.reduce((a,p)=>a+o[p][i],0);
function ksFoot(){const t=S.posts.ks.reduce((a,s)=>a+(+s[0]||0),0);return `<div class="post"><span class="nm"><button class="btn" data-add="1">+ Dela upp på fler personer</button></span><b class="${t===100?'ok':'bad'}">${t} % av 100 %${t===100?' ✓':''}</b></div>`}
function postRows(key,def){if(key==='ks')def=S.posts.ks.map((s,i)=>def[i]||['Delad del av arvodet',100]);return def.map((d,i)=>{const s=S.posts[key][i];if(key!=='ks')s[0]=key==='fm'?FMP[i][1]:key==='rev'?REV[i][1]:(PCT[key]??d[1]);
return `<div class="post"><span class="nm">${d[0]}</span>${key==='ks'?`<input type="number" min="0" max="100" step="10" value="${s[0]}" data-pct="${key}:${i}" aria-label="Arvode procent"> %`:`<span class="badge" title="Fast arvode">🔒 ${s[0]} %</span>`}
<select data-post="${key}:${i}">${[...new Set([...el(),s[1]])].map(p=>`<option${p===s[1]?' selected':''}>${p}</option>`).join('')}</select>${key==='ks'&&i>=2?`<button class="btn" data-del="${i}">Ta bort</button>`:''}</div>`}).join('')+(key==='ks'?ksFoot():'')}
function render(){
let h='';
// fullmäktige
h+=`<div class="card"><div class="hd"><h2>Kommunfullmäktige <span class="size">låst</span></h2><span class="badge">🔒 ändras inte</span></div><div class="scroll"><table><tr><th>Parti</th><th>Ledamöter</th><th>Ersättare</th></tr>${P.map(p=>`<tr><td>${pt(p)}</td><td class="lockc">${FM[p][0]}</td><td class="lockc">${FM[p][1]}</td></tr>`).join('')}</table></div><div class="posts">${postRows('fm',FMP)}</div></div>`;
document.getElementById('fm').innerHTML=h;
// nämnder
const tot={};P.forEach(p=>tot[p]={fl:0,fe:0,vl:0,ve:0,pct:0});
let bh='';
B.forEach(b=>{const v=S.seats[b.id];
const sl=sum(v,0),se=sum(v,1),okl=sl===b.l,oke=se===b.e;
const st=(n,t,lbl)=>n===t?`<span class="ok">${lbl} ${n}/${t} ✓</span>`:`<span class="bad">${lbl} ${n}/${t} ! ${n>t?(n-t)+' för många':(t-n)+' saknas'}</span>`;
let rows=P.map(p=>{const f=b.f[p],x=v[p];tot[p].fl+=f[0];tot[p].fe+=f[1];tot[p].vl+=x[0];tot[p].ve+=x[1];
const cell=i=>{const d=x[i]-f[i];return `<td><span class="step ${d>0?'gain':d<0?'loss':''}"><button data-s="${b.id}:${p}:${i}:-1" aria-label="minska">−</button><output>${x[i]}</output><button data-s="${b.id}:${p}:${i}:1" aria-label="öka">+</button></span></td>`};
const ch=[];[0,1].forEach(i=>{const d=x[i]-f[i];if(d)ch.push(`<span class="chip ${d>0?'g':'l'}">${d>0?'+':'−'}${Math.abs(d)} ${i?'ers.':'led.'}</span>`)});
return `<tr><td>${pt(p)}</td><td class="lockc">${f[0]}</td><td class="lockc">${f[1]}</td>${cell(0)}${cell(1)}<td class="chg">${ch.join('')||'<span style="color:var(--mut)">–</span>'}</td></tr>`}).join('');
bh+=`<div class="card"><div class="hd"><h2>${b.n} <span class="size">${b.l} ledamöter + ${b.e} ersättare</span></h2><span class="badge ${okl&&oke?'ok':'bad'}">${okl&&oke?'✓ stämmer':'! justera'}</span></div>
<div class="scroll"><table><tr><th></th><th colspan="2" class="lockc">d’Hondt (låst)</th><th colspan="2">Förhandlas</th><th>Ändring</th></tr><tr><th>Parti</th><th class="lockc">Led.</th><th class="lockc">Ers.</th><th>Led.</th><th>Ers.</th><th></th></tr>${rows}
<tfoot><tr><td></td><td class="lockc" colspan="2">${b.l} + ${b.e}</td><td>${st(sl,b.l,'Led.')}</td><td>${st(se,b.e,'Ers.')}</td><td></td></tr></tfoot></table></div>
${b.posts.length?`<div class="posts">${postRows(b.id,b.posts)}</div>`:''}</div>`;
S.posts[b.id].forEach(s=>{if(P.includes(s[1]))tot[s[1]].pct+=+s[0]||0});
});
document.getElementById('bodies').innerHTML=bh;
document.getElementById('rev').innerHTML=`<div class="card"><div class="hd"><h2>Revisorer</h2></div><div class="posts" style="border:0;margin:0;padding:0">${postRows('rev',REV)}</div></div>`;
// sammanfattning
['fm','rev'].forEach(k=>S.posts[k].forEach(s=>{if(P.includes(s[1]))tot[s[1]].pct+=+s[0]||0}));
const tp=P.reduce((a,p)=>a+tot[p].pct,0);
const W=S.w??0.5,pool=B.reduce((a,b)=>a+b.l+W*b.e,0),sp=p=>tot[p].vl+W*tot[p].ve,FT=215,fmT=P.reduce((a,p)=>a+FM[p][0],0),n1=x=>x.toLocaleString('sv-SE',{maximumFractionDigits:1});
const fmA=el().reduce((a,p)=>a+FM[p][0],0),ak=p=>el().includes(p)?FM[p][0]/fmA*FT:0;
const dh=(()=>{const a={};P.forEach(p=>a[p]=0);const q=p=>FM[p][0]/(a[p]+1);for(let i=0;i<FT/5;i++){const b=el().reduce((x,y)=>q(y)>q(x)||(q(y)===q(x)&&FM[y][0]>FM[x][0])?y:x);a[b]++}P.forEach(p=>a[p]*=5);return a})();
const cnt=p=>{let n=0;[ 'fm','rev'].forEach(k=>S.posts[k].forEach(s=>{if(s[1]===p)n++}));B.forEach(b=>S.posts[b.id].forEach(s=>{if(s[1]===p)n++}));return n};
const dd=(a,b)=>a===b?'<span style="color:var(--mut)">–</span>':`<span class="chip ${a>b?'g':'l'}">${a>b?'+':'−'}${Math.abs(a-b)}</span>`;
document.getElementById('summary').innerHTML=`<div class="card sum"><div class="hd"><h2>Sammanfattning per parti <span class="size">Arvodet fördelas med d’Hondt på fullmäktigemandaten. Diff arvode: plus = partiet har mer arvode än d’Hondt, minus = mindre. Nämndpoängen jämförs mot partiets andel av fullmäktigemandaten (${fmT} st).</span></h2></div><div class="scroll"><table><tr><th>Parti</th><th class="lockc">Led. d’Hondt</th><th>Led. nu</th><th class="lockc">Ers. d’Hondt</th><th>Ers. nu</th><th class="lockc">FM-mandat</th><th class="lockc">Andel (nyckel)</th><th>Poster</th><th>Arvode nu</th><th class="lockc">Arvode enligt d’Hondt</th><th>Diff arvode</th><th>Nämndpoäng nu</th><th class="lockc">Poäng enligt nyckel</th><th>Diff poäng</th></tr>${P.map(p=>{const t=tot[p];return `<tr><td>${pt(p)}</td><td class="lockc">${t.fl}</td><td>${t.vl} ${dd(t.vl,t.fl)}</td><td class="lockc">${t.fe}</td><td>${t.ve} ${dd(t.ve,t.fe)}</td><td class="lockc">${FM[p][0]}</td><td class="lockc">${n1(FM[p][0]/fmT*100)} %</td><td>${cnt(p)}</td><td>${t.pct} %</td><td class="lockc">${dh[p]} %</td><td>${(()=>{const d=Math.round((t.pct-dh[p])*10)/10;return d===0?'<span style="color:var(--mut)">–</span>':`<span class="chip ${d>0?'g':'l'}">${d>0?'+':'−'}${n1(Math.abs(d))} %</span>`})()}</td><td>${n1(sp(p))}</td><td class="lockc">${n1(FM[p][0]/fmT*pool)}</td><td>${(()=>{const d=Math.round((sp(p)-FM[p][0]/fmT*pool)*10)/10;return d===0?'<span style="color:var(--mut)">–</span>':`<span class="chip ${d>0?'g':'l'}">${d>0?'+':'−'}${n1(Math.abs(d))}</span>`})()}</td></tr>`}).join('')}</table></div><p class="sub" style="margin:8px 0 0">Total arvode för oppositionen: <b class="${tp===215?'ok':'bad'}">${tp} % av 215 %${tp===215?' ✓':tp>215?' ! '+(tp-215)+' % över':' ! '+(215-tp)+' % kvar'}</b></p><p class="sub" style="margin:8px 0 0"><b>Arvoderade poster fördelas på:</b> <label><input type="radio" name="two" data-two="all" ${S.two===false?'checked':''}> alla partier</label> &nbsp; <label><input type="radio" name="two" data-two="two" ${S.two===false?'':'checked'}> de två största (MP och C)</label> ${(()=>{const n=P.filter(p=>!el().includes(p)).reduce((a,p)=>a+cnt(p),0);return n&&S.two!==false?`<b class="bad">! ${n} post(er) ligger hos annat parti</b>`:''})()}</p><p class="sub" style="margin:8px 0 0">Nämndpoäng: ledamot = 1 poäng, ersättare = <input type="number" min="0" max="1" step="0.1" value="${W}" data-w="1" aria-label="Ersättarens vikt"> poäng. Poängen fördelas enligt andelen fullmäktigemandat på de ${n1(pool)} poäng som nämnderna ger totalt (fullmäktige räknas inte med).</p></div>`;
save()}
document.addEventListener('click',e=>{const ad=e.target.closest('[data-add]');if(ad){S.posts.ks.push([0,'C']);render();return}const dl=e.target.closest('[data-del]');if(dl){S.posts.ks.splice(+dl.dataset.del,1);render();return}const b=e.target.closest('[data-s]');if(b){const[id,p,i,d]=b.dataset.s.split(':');const a=S.seats[id][p];a[+i]=Math.max(0,a[+i]+ +d);render()}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.two){S.two=t.dataset.two==='two';render();return}if(t.dataset.w){S.w=Math.max(0,+t.value||0);render();return}if(t.dataset.post){const[k,i]=t.dataset.post.split(':');S.posts[k][+i][1]=t.value;render()}
if(t.dataset.pct){const[k,i]=t.dataset.pct.split(':');S.posts[k][+i][0]=Math.max(0,+t.value||0);render()}});
document.getElementById('reset').onclick=()=>{if(confirm('Återställa alla ändringar till utgångsläget?')){init();render()}};
load();render();
</script></body></html>
